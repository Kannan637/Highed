name: HighEd Zero-Known-Issues Quality Gates

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: 100% Target Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-playwright requests pydantic
          playwright install --with-deps chromium

      # Gate 1: TypeScript Zero Errors
      - name: Gate 1 - TypeScript Compilation (0 Errors)
        working-directory: ./frontend
        run: npx tsc --noEmit

      # Gate 2: ESLint Zero Errors & Explicit Any Check
      - name: Gate 2 - ESLint Validation (0 Errors)
        working-directory: ./frontend
        run: npm run lint

      # Gate 3: Production Build Verification
      - name: Gate 3 - Next.js Production Build
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-test-secret-salt-2026' }}

      # Gate 4: Security Architecture Tests
      - name: Gate 4 - Edge & API Security Tests
        run: |
          # Start Next.js production server in background
          cd frontend && npm run start &
          # Wait for server readiness
          timeout 30 bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 1; done'
          cd ..
          pytest frontend/tests/security/test_admin_auth.py -v

      # Gate 5: Regulatory & Content Freshness Tests
      - name: Gate 5 - Content & Regulatory Integrity Tests
        run: pytest frontend/tests/content/test_content_integrity.py -v

      # Gate 6: Playwright E2E & WCAG Accessibility
      - name: Gate 6 - Playwright E2E & Accessibility Tests
        run: pytest frontend/tests/ -v --ignore=frontend/tests/security --ignore=frontend/tests/content

      # Gate 7: Lighthouse CI Quality Thresholds
      - name: Gate 7 - Lighthouse CI Quality Gates
        working-directory: ./frontend
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --config=./.lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
